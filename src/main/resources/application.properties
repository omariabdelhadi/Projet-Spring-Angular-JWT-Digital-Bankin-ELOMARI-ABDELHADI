spring.application.name=banck-ABDELHADI-ELOMARI

# ============================================
# JWT Configuration
# ============================================
app.jwtSecret=mySecretKeyForJWTTokenGenerationThatMustBeLongEnoughForHS512Algorithm
# Token expiration time in milliseconds (1 hour = 3600000)
app.jwtExpirationInMs=3600000

# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/banque_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.abdelhadielomari.banck=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# Server Configuration
# ============================================
server.port=8085
server.servlet.context-path=/
spring.mvc.servlet.path=/

# ============================================
# Swagger/OpenAPI Configuration
# ============================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# CORS Configuration (géré dans SecurityConfig)
# ============================================
# Les CORS sont configurés dans la classe SecurityConfig.java
